<svg width="1600" height="520" viewBox="0 0 1600 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="520" gradientUnits="userSpaceOnUse"><stop stop-color="#07111F"/><stop offset="1" stop-color="#102B2B"/></linearGradient>
    <linearGradient id="line" x1="80" y1="0" x2="1520" y2="0"><stop stop-color="#21E6A5" stop-opacity="0"/><stop offset=".5" stop-color="#21E6A5"/><stop offset="1" stop-color="#F5C451" stop-opacity="0"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" stroke="#B6D8D0" stroke-opacity=".08"/></pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .card { animation: lift 3.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .card:nth-of-type(2) { animation-delay: .25s; }.card:nth-of-type(3) { animation-delay: .5s; }.card:nth-of-type(4) { animation-delay: .75s; }.card:nth-of-type(5) { animation-delay: 1s; }.card:nth-of-type(6) { animation-delay: 1.25s; }
      .beam { animation: sweep 5s linear infinite; }
      .spark { animation: blink 1.8s ease-in-out infinite; }
      @keyframes lift { 0%,100% { transform: translateY(0); opacity: .82; } 50% { transform: translateY(-7px); opacity: 1; } }
      @keyframes sweep { from { transform: translateX(-1500px); } to { transform: translateX(1500px); } }
      @keyframes blink { 0%,100% { opacity: .25; } 50% { opacity: 1; } }
    </style>
  </defs>
  <rect width="1600" height="520" rx="24" fill="url(#bg)"/><rect width="1600" height="520" rx="24" fill="url(#grid)"/>
  <text x="80" y="62" fill="#21E6A5" font-family="monospace" font-size="15" letter-spacing="4">AERIS / CAPABILITY DECK</text>
  <text x="80" y="100" fill="#F4F7EF" font-family="Arial, sans-serif" font-size="28" font-weight="700">One signal. Six layers of engine intelligence.</text>
  <path d="M80 145H1520" stroke="#29484B"/><path class="beam" d="M80 145H420" stroke="url(#line)" stroke-width="8" opacity=".65" filter="url(#glow)"/>
  <g class="card"><rect x="80" y="190" width="220" height="205" rx="12" fill="#0C2730" stroke="#21E6A5" stroke-opacity=".55"/><circle cx="116" cy="230" r="9" fill="#21E6A5" class="spark"/><text x="140" y="236" fill="#21E6A5" font-family="monospace" font-size="12" letter-spacing="2">01 / TWIN</text><text x="105" y="290" fill="#F4F7EF" font-family="Arial, sans-serif" font-size="21" font-weight="700">Physics model</text><text x="105" y="323" fill="#8AA7A2" font-family="Arial, sans-serif" font-size="14">Expected state under</text><text x="105" y="345" fill="#8AA7A2" font-family="Arial, sans-serif" font-size="14">altitude, load, and heat.</text><path d="M105 370H275" stroke="#21E6A5" stroke-opacity=".5"/></g>
  <g class="card"><rect x="330" y="190" width="220" height="205" rx="12" fill="#0C2730" stroke="#21E6A5" stroke-opacity=".55"/><circle cx="366" cy="230" r="9" fill="#21E6A5" class="spark"/><text x="390" y="236" fill="#21E6A5" font-family="monospace" font-size="12" letter-spacing="2">02 / DELTA</text><text x="355" y="290" fill="#F4F7EF" font-family="Arial, sans-serif" font-size="21" font-weight="700">Residuals</text><text x="355" y="323" fill="#8AA7A2" font-family="Arial, sans-serif" font-size="14">Separate degradation</text><text x="355" y="345" fill="#8AA7A2" font-family="Arial, sans-serif" font-size="14">from normal operation.</text><path d="M355 370H525" stroke="#21E6A5" stroke-opacity=".5"/></g>
  <g class="card"><rect x="580" y="190" width="220" height="205" rx="12" fill="#0C2730" stroke="#21E6A5" stroke-opacity=".55"/><circle cx="616" cy="230" r="9" fill="#21E6A5" class="spark"/><text x="640" y="236" fill="#21E6A5" font-family="monospace" font-size="12" letter-spacing="2">03 / DETECT</text><text x="605" y="290" fill="#F4F7EF" font-family="Arial, sans-serif" font-size="21" font-weight="700">Anomalies</text><text x="605" y="323" fill="#8AA7A2" font-family="Arial, sans-serif" font-size="14">Isolation Forest scores</text><text x="605" y="345" fill="#8AA7A2" font-family="Arial, sans-serif" font-size="14">unusual residual patterns.</text><path d="M605 370H775" stroke="#21E6A5" stroke-opacity=".5"/></g>
  <g class="card"><rect x="830" y="190" width="220" height="205" rx="12" fill="#102B2B" stroke="#F5C451" stroke-opacity=".7"/><circle cx="866" cy="230" r="9" fill="#F5C451" class="spark"/><text x="890" y="236" fill="#F5C451" font-family="monospace" font-size="12" letter-spacing="2">04 / EXPLAIN</text><text x="855" y="290" fill="#F4F7EF" font-family="Arial, sans-serif" font-size="21" font-weight="700">Fault modes</text><text x="855" y="323" fill="#B6B09A" font-family="Arial, sans-serif" font-size="14">Classify and rank the</text><text x="855" y="345" fill="#B6B09A" font-family="Arial, sans-serif" font-size="14">evidence behind a fault.</text><path d="M855 370H1025" stroke="#F5C451" stroke-opacity=".55"/></g>
  <g class="card"><rect x="1080" y="190" width="220" height="205" rx="12" fill="#102B2B" stroke="#F5C451" stroke-opacity=".7"/><circle cx="1116" cy="230" r="9" fill="#F5C451" class="spark"/><text x="1140" y="236" fill="#F5C451" font-family="monospace" font-size="12" letter-spacing="2">05 / FORECAST</text><text x="1105" y="290" fill="#F4F7EF" font-family="Arial, sans-serif" font-size="21" font-weight="700">Health + RUL</text><text x="1105" y="323" fill="#B6B09A" font-family="Arial, sans-serif" font-size="14">Project wear forward</text><text x="1105" y="345" fill="#B6B09A" font-family="Arial, sans-serif" font-size="14">with confidence bounds.</text><path d="M1105 370H1275" stroke="#F5C451" stroke-opacity=".55"/></g>
  <g class="card"><rect x="1330" y="190" width="190" height="205" rx="12" fill="#102B2B" stroke="#F5C451" stroke-opacity=".7"/><circle cx="1366" cy="230" r="9" fill="#F5C451" class="spark"/><text x="1390" y="236" fill="#F5C451" font-family="monospace" font-size="12" letter-spacing="2">06 / ACT</text><text x="1355" y="290" fill="#F4F7EF" font-family="Arial, sans-serif" font-size="21" font-weight="700">Mission ops</text><text x="1355" y="323" fill="#B6B09A" font-family="Arial, sans-serif" font-size="14">Replay, compare,</text><text x="1355" y="345" fill="#B6B09A" font-family="Arial, sans-serif" font-size="14">and maintain.</text><path d="M1355 370H1495" stroke="#F5C451" stroke-opacity=".55"/></g>
  <text x="80" y="465" fill="#6F908B" font-family="monospace" font-size="12" letter-spacing="2">OBSERVE  //  MODEL  //  EXPLAIN  //  FORECAST  //  ACT</text>
</svg>
